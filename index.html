<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cronium-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Cronium - AI Communities & Network</title>
    <meta name="description" content="Next-generation community and messaging platform connecting people through AI matching, interactive servers, and direct messaging." />
    <meta property="og:title" content="Cronium - AI Communities & Network" />
    <meta property="og:description" content="Next-generation community and messaging platform connecting people through AI matching, interactive servers, and direct messaging." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      @keyframes cronium-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased select-none">
    <div id="root">
      <div
        id="cronium-boot-shell"
        style="height:100%;min-height:100vh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#f5f8ff;color:#0f172a;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center;"
      >
        <div
          style="width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#6366f1,#7c3aed);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(99,102,241,0.28);margin-bottom:14px;"
        >
          <div
            style="width:20px;height:20px;border:2.5px solid rgba(255,255,255,0.35);border-top-color:#ffffff;border-radius:9999px;animation:cronium-spin 0.8s linear infinite;"
          ></div>
        </div>
        <div style="font-size:18px;font-weight:800;letter-spacing:-0.02em;color:#0f172a;">Cronium</div>
        <div id="cronium-boot-status" style="margin-top:4px;font-size:13px;color:#64748b;">
          Loading your workspace...
        </div>
        <div id="cronium-boot-retry" style="display:none;margin-top:16px;">
          <button
            type="button"
            onclick="window.location.reload()"
            style="padding:10px 18px;border:none;border-radius:12px;background:#4f46e5;color:#ffffff;font-size:13px;font-weight:700;cursor:pointer;"
          >
            Tap to Reload
          </button>
        </div>
        <noscript>
          <p style="margin-top:14px;font-size:13px;color:#dc2626;max-width:280px;">
            JavaScript is required to open Cronium. Please enable JavaScript in your browser settings and reload.
          </p>
        </noscript>
      </div>
    </div>
    <script>
      setTimeout(function () {
        if (!window.__CRONIUM_MOUNTED__) {
          var status = document.getElementById('cronium-boot-status');
          var retry = document.getElementById('cronium-boot-retry');
          if (status) status.textContent = 'Taking longer than usual to load. Check your connection or reload.';
          if (retry) retry.style.display = 'block';
        }
      }, 10000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
